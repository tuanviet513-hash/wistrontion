<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Cấu hình thanh trạng thái chữ/biểu tượng màu đen trên nền trắng -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <link rel="apple-touch-icon" href="icon.png">
    <title>二维码通行</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #ffffff;
            color-scheme: light; /* Ép iOS hiển thị biểu tượng chữ/pin/wifi màu đen */
            height: 100%;
        }

         body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 20px);
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background-image: url("background.png");
            background-color: #1d1d2b;
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* Dải nền màu trắng đệm cho khu vực Status Bar */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top, 20px);
            background-color: #ffffff;
            z-index: 9999;
        }

        .header {
            margin-top: 15px;
            font-size: 20px;
            color: #d1b883;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .card {
    margin-top: 22px;
    width: 80%;
    max-width: 300px;
    
    /* Màu trắng tuyệt đối trùng khớp với nền QR */
    background-color: #ffffff; 
    
    border-radius: 4px;
    overflow: hidden;
    filter: contrast(120%);
}

        .card-header {
            background-color: #f0bd38;
            padding: 20px 10px;
            text-align: center;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 16px 10px 17px 10px;
            text-align: center;
            color: #000;
            position: relative;
        }

        .time {
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 400;
            color: #222222;
            letter-spacing: 0.3px;
        }

        #qrcode {
    margin: auto;
    width: 230px;
    height: 230px;
    image-rendering: pixelated;
    font-weight: bold; /* Tăng độ đậm cho văn bản bên trong */
}

#qrcode img {
    width: 230px;
    height: 230px;
    filter: contrast(120%); /* Tăng độ tương phản đen/trắng cực đại */
    }
    
        .refresh {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11.5px;
            color: #444444;
        }

        .refresh-title {
            cursor: pointer;
            margin: 0;
            padding: 2px 10px;
        }

        .status-wrapper {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .status-bg {
            font-size: 16px;
            color: #00cc66;
            font-weight: 400;
            line-height: 1.2;
        }

        .status-timer {
            color: #00cc66;
            font-size: 16px;
            font-weight: 400;
            margin-top: 2px;
        }

        .note {
  /* Thay 11% bằng padding/margin chính xác của thẻ màu trắng ở trên */
  margin: 32px auto; 
  width: 60%; /* Chỉnh % này sao cho bằng đúng độ rộng (width) của thẻ màu trắng */
  font-size: 16px;
  color: #baaa82;
  line-height: 1.65;
  text-align: justify;
  text-justify: inter-ideograph;
  letter-spacing: 0.2px;
}


        .relative {
            position: relative;
        }

        .circle1, .circle2 {
            position: absolute;
            background-color: #232435;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            bottom: -6px;
        }

        .circle1 { left: -6px; }
        .circle2 { right: -6px; }
    </style>
</head>

<body>
    <div class="header">V25071461(Nguyễn Tuấn Việt)</div>
    <div class="card">
        <div class="card-header relative">
            <p style="margin: 0;">将二维码对准扫描器刷码出场</p>
            <div class="circle1"></div>
            <div class="circle2"></div>
        </div>

        <div class="card-body">
            <div class="time" id="currentTime">--</div>
            <div id="qrcode"></div>
            <div class="refresh">
                <p onclick="generateQRCode(event)" class="refresh-title">刷新二维码</p>
            </div>
            
            <div class="status-wrapper">
                <div class="status-bg">已生效</div>
                <div class="status-timer" id="countdown">00:00</div>
            </div>
        </div>
    </div>

    <div class="note">
        尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
    </div>

    <script>
        let qrCodeInstance;
        let totalSeconds = 8386;

        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateTime() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('currentTime').textContent = formatted;
        }

        function updateTimer() {
            totalSeconds++;
            
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;

            if (totalSeconds < 3600) {
                document.getElementById('countdown').textContent = `${pad(mins)}:${pad(secs)}`;
            } else {
                document.getElementById('countdown').textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            }
        }

        function generateQRCode(event) {
            if (event && event.currentTarget) {
                event.currentTarget.blur();
            }

            const now = new Date();
            const formattedTime = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const employeeId = "V25071461";
            const employeeName = "Nguyễn Tuấn Việt";
            const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
            const accessData = `https://Wistron.com/access?id=${employeeId}&name=${encodeURIComponent(employeeName)}&time=${encodeURIComponent(formattedTime)}&token=${uniqueToken}`;

            const qrcodeElement = document.getElementById('qrcode');
            if (qrCodeInstance) {
                qrCodeInstance.clear();
                qrCodeInstance.makeCode(accessData);
            } else {
                qrCodeInstance = new QRCode(qrcodeElement, {
                    text: accessData,
                    width: 240,
                    height: 240,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        updateTime();
        generateQRCode();
        setInterval(updateTime, 1000);
        setInterval(updateTimer, 1000);
    </script>
</body>

</html>
