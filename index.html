<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no " />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <link rel="apple-touch-icon" href="icon.png">
    <title>二维码通行</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background-color: #000;
        }

        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-image: url("background.png");
            background-repeat: no-repeat;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            background-size: cover;
            height: 100vh;
        }

        .header {
            margin-top: 40px;
            font-size: 18px;
            color: #E4BE5D;
        }

        .card {
            margin-top: 20px;
            width: fit-content;
            min-width: 260px;
            background: #fff;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
        }

        .card-header {
            background-color: #3bb561;
            padding: 10px 8px;
            text-align: center;
            color: white;
            font-size: 14px;
        }

        .card-header p {
            margin: 0;
        }

        .card-body {
            padding: 10px;
            text-align: center;
            color: #000;
        }

        .time {
            font-size: 14px;
            margin-bottom: 8px;
        }

        #qrcode {
            margin: auto;
            width: 220px;
            height: 220px;
            image-rendering: pixelated;
        }

        .refresh {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            color: #333;
            margin-top: 8px;
        }

        .refresh-title {
            cursor: pointer;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Đồng hồ đếm màu xanh */
        .status {
            margin-top: 12px;
            margin-bottom: 4px;
            color: #2bd870;
            font-size: 10px;
            font-weight: 500;
        }

        .note {
            margin: 30px 10%;
            font-size: 12px;
            color: #e5d8b7;
            line-height: 1.7;
            text-align: -webkit-left;
            text-indent: 1.5em;
        }

        .bottom-bar {
            width: 100%;
            height: 4px;
            background-color: transparent;
        }

        img {
            width: 230px;
            height: 230px;
        }

        .relative {
            position: relative;
        }

        .circle1, .circle2 {
            position: absolute;
            background-color: rgb(61, 62, 82);
            height: 12px;
            width: 12px;
            border-radius: 50%;
            bottom: -6px;
        }

        .circle1 { left: -6px; }
        .circle2 { right: -6px; }
    </style>
</head>

<body>
    <div class="header">V25071461(Nguyễn Tuấn Việt)</div>
    <div class="card">
        <div class="card-header relative">
            <p>将二维码对准扫描器刷码进场</p>
            <div class="circle1"></div>
            <div class="circle2"></div>
        </div>

        <div class="card-body">
            <div class="time" id="currentTime">--</div>
            <div id="qrcode"></div>
            <div class="refresh">
                <span>申请离场</span>
                <span onclick="generateQRCode(event)" class="refresh-title">刷新二维码</span>
            </div>
            <!-- Bộ đếm thời gian bắt đầu từ 00:00 -->
            <div class="status" id="timer">00:00</div>
        </div>
    </div>
    <div class="note">
        尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
    </div>
    <div class="bottom-bar"></div>

    <script>
        let qrCodeInstance;
        let countTimer;
        let totalSeconds = 0; // Biến tính tổng số giây
        const maxSeconds = 12 * 3600; // Giới hạn dừng lại ở 12:00:00

        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateTime() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${now.getMonth() + 1}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('currentTime').textContent = formatted;
        }

        // Định dạng thời gian linh hoạt (MM:SS hoặc HH:MM:SS)
        function formatTimerDisplay(sec) {
            const hrs = Math.floor(sec / 3600);
            const mins = Math.floor((sec % 3600) / 60);
            const secs = sec % 60;

            if (hrs > 0) {
                // Từ 1 giờ trở lên -> HH:MM:SS (VD: 01:00:00)
                return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            } else {
                // Dưới 1 giờ -> MM:SS (VD: 00:00 đến 59:59)
                return `${pad(mins)}:${pad(secs)}`;
            }
        }

        // Bắt đầu đếm thời gian từ 00:00
        function startCountUp() {
            clearInterval(countTimer);
            totalSeconds = 0;
            
            const timerEl = document.getElementById('timer');
            timerEl.textContent = formatTimerDisplay(totalSeconds);

            countTimer = setInterval(() => {
                if (totalSeconds < maxSeconds) {
                    totalSeconds++;
                    timerEl.textContent = formatTimerDisplay(totalSeconds);
                } else {
                    clearInterval(countTimer); // Dừng lại khi chạm 12:00:00
                }
            }, 1000);
        }

        function generateQRCode(event) {
            if (event && event.currentTarget) {
                event.currentTarget.blur();
            }

            const now = new Date();
            const formattedTime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            const employeeId = "V25071461";
            const employeeName = "Nguyễn Tuấn Việt";
            const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
            const accessData = `https://Wistron.com/access?id=${employeeId}&name=${encodeURIComponent(employeeName)}&time=${encodeURIComponent(formattedTime)}&token=${uniqueToken}`;
            
            const qrcodeElement = document.getElementById('qrcode');
            if (qrCodeInstance) {
                qrCodeInstance.clear();
                qrCodeInstance.makeCode(accessData);
            } else {
                qrCodeInstance = new QRCode(qrcodeElement, {
                    text: accessData,
                    width: 230,
                    height: 230,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }

            // Đặt lại bộ đếm về 00:00 khi tạo/làm mới QR
            startCountUp();
        }

        // Khởi tạo ban đầu
        updateTime();
        generateQRCode();
        setInterval(updateTime, 1000);
    </script>
</body>

</html>
